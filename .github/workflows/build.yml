name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup OpenWrt SDK
        run: |
          # 尝试多个镜像源
          SDK_URLS=(
            "https://mirrors.pku.edu.cn/immortalwrt/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
            "https://mirrors.tuna.tsinghua.edu.cn/immortalwrt/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
            "https://downloads.immortalwrt.org/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          )
          
          for url in "${SDK_URLS[@]}"; do
            echo "Trying: $url"
            if wget -q --timeout=30 --tries=2 "$url"; then
              echo "Downloaded from: $url"
              break
            fi
          done
          
          if [ ! -f immortalwrt-sdk-*.tar.xz ]; then
            echo "All mirrors failed"
            exit 1
          fi
          
          tar -xf immortalwrt-sdk-*.tar.xz
          cd immortalwrt-sdk-*
          echo "SDK_PATH=$(pwd)" >> $GITHUB_OUTPUT
        id: sdk
          
      - name: Build IPK
        run: |
          cd ${{ steps.sdk.outputs.SDK_PATH }}
          cp -r ${{ github.workspace }} package/luci-app-daede
          make package/luci-app-daede/compile V=s
          
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: immortalwrt-sdk-*/bin/packages/**/*.ipk
