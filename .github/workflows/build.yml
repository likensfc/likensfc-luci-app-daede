name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget tar xz-utils build-essential gcc g++ gawk flex bison libncurses5-dev libssl-dev zlib1g-dev unzip python3

      - name: Download ImmortalWrt SDK
        id: sdk
        run: |
          # ImmortalWrt 24.10 基于 OpenWrt 23.05，用 23.05 SDK
          SDK_URL="https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          
          echo "Downloading: $SDK_URL"
          wget -q --show-progress --timeout=120 --tries=3 "$SDK_URL" -O sdk.tar.xz || \
          wget -q --timeout=120 --tries=3 "https://mirrors.pku.edu.cn/openwrt/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz" -O sdk.tar.xz || \
          wget -q --timeout=120 --tries=3 "https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz" -O sdk.tar.xz

          [ -s sdk.tar.xz ] || { echo "All downloads failed"; exit 1; }
          tar -xf sdk.tar.xz
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_OUTPUT

      - name: Build IPK
        run: |
          cd "${{ steps.sdk.outputs.SDK_DIR }}"
          cp -r "${{ github.workspace }}" package/luci-app-daede
          make package/luci-app-daede/compile V=s

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: openwrt-sdk-*/bin/packages/**/luci-app-daede*.ipk
