name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget tar xz-utils build-essential gcc g++ gawk flex bison libncurses5-dev libssl-dev zlib1g-dev unzip python3

      - name: Download SDK (With Retry & Mirror)
        id: sdk
        run: |
          URLS=(
            "https://github.com/openwrt/openwrt/releases/download/v23.05.5/openwrt-sdk-23.05.5-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
            "https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          )
          
          SUCCESS=0
          for url in "${URLS[@]}"; do
            echo "Trying to download from: $url"
            if curl -L --retry 5 --retry-delay 5 --connect-timeout 30 -o sdk.tar.xz "$url"; then
              if [ -s sdk.tar.xz ]; then
                echo "Download successful!"
                SUCCESS=1
                break
              fi
            fi
            echo "Download failed, trying next..."
          done
          
          [ $SUCCESS -eq 1 ] || { echo "All download sources failed!"; exit 1; }
          
          tar -xf sdk.tar.xz
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_OUTPUT

      - name: Build IPK
        run: |
          cd "${{ steps.sdk.outputs.SDK_DIR }}"
          cp -r "${{ github.workspace }}" package/luci-app-daede
          make package/luci-app-daede/compile V=s

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: openwrt-sdk-*/bin/packages/**/luci-app-daede*.ipk
