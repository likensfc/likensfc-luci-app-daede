name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download SDK & Build
        run: |
          # 使用清华镜像下载 OpenWrt 24.10 SDK (兼容 ImmortalWrt 24.10)
          SDK_URL="https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          
          echo "Downloading SDK from: $SDK_URL"
          wget -q --timeout=60 --tries=3 "$SDK_URL" -O sdk.tar.xz || {
            echo "清华镜像失败，尝试北大镜像..."
            wget -q --timeout=60 --tries=3 "https://mirrors.pku.edu.cn/openwrt/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz" -O sdk.tar.xz
          } || {
            echo "北大镜像失败，尝试官方源..."
            wget -q --timeout=60 --tries=3 "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz" -O sdk.tar.xz
          }
          
          # 验证文件
          if [ ! -f sdk.tar.xz ] || [ ! -s sdk.tar.xz ]; then
            echo "All downloads failed"
            exit 1
          fi
          
          tar -xf sdk.tar.xz
          SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -1)
          cd "$SDK_DIR"
          
          # 复制源码
          cp -r /home/runner/work/likensfc-luci-app-daede/likensfc-luci-app-daede package/luci-app-daede
          
          # 编译
          make package/luci-app-daede/compile V=s
        working-directory: /home/runner
          
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: openwrt-sdk-*/bin/packages/**/luci-app-daede*.ipk
