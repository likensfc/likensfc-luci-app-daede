name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget tar xz-utils build-essential gcc g++ gawk flex bison libncurses5-dev libssl-dev zlib1g-dev unzip python3

      - name: Download ImmortalWrt 24.10.6 SDK
        id: sdk
        run: |
          # 使用 ImmortalWrt 24.10.6 官方 x86_64 SDK 链接与国内镜像
          URLS=(
            "https://downloads.immortalwrt.org/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
            "https://mirror.nju.edu.cn/immortalwrt/releases/24.10.6/targets/x86/64/immortalwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          )
          
          SUCCESS=0
          for url in "${URLS[@]}"; do
            echo "Trying to download from: $url"
            rm -f sdk.tar.xz
            if curl -L --retry 5 --retry-delay 5 --connect-timeout 30 -o sdk.tar.xz "$url"; then
              # 校验文件大小是否大于 50MB，过滤掉 404 错误网页
              FILE_SIZE=$(stat -c%s sdk.tar.xz 2>/dev/null || stat -f%z sdk.tar.xz 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt 50000000 ]; then
                echo "Download successful! File size: $FILE_SIZE bytes"
                SUCCESS=1
                break
              else
                echo "Downloaded file is too small ($FILE_SIZE bytes), likely a 404 page. Trying next..."
              fi
            fi
            echo "Download failed, trying next..."
          done
          
          [ $SUCCESS -eq 1 ] || { echo "All download sources failed!"; exit 1; }
          
          tar -xf sdk.tar.xz
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_OUTPUT

      - name: Build IPK
        run: |
          cd "${{ steps.sdk.outputs.SDK_DIR }}"
          cp -r "${{ github.workspace }}" package/luci-app-daede
          make package/luci-app-daede/compile V=s

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: immortalwrt-sdk-*/bin/packages/**/luci-app-daede*.ipk
