name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget tar xz-utils build-essential gcc g++ gawk flex bison libncurses5-dev libssl-dev zlib1g-dev unzip python3

      - name: Download ImmortalWrt SDK (Dynamic Auto-Fetch)
        id: sdk
        run: |
          VERSIONS=("24.10.6" "24.10.0" "snapshots")
          SUCCESS=0
          
          for ver in "${VERSIONS[@]}"; do
            if [ "$ver" = "snapshots" ]; then
              DIR_URL="https://downloads.immortalwrt.org/snapshots/targets/x86/64/"
            else
              DIR_URL="https://downloads.immortalwrt.org/releases/$ver/targets/x86/64/"
            fi
            
            echo "Scanning directory: $DIR_URL"
            SDK_NAME=$(curl -s "$DIR_URL" | grep -oE 'immortalwrt-sdk-[^"]+\.tar\.xz' | head -1)
            
            if [ -n "$SDK_NAME" ]; then
              URL="${DIR_URL}${SDK_NAME}"
              echo "Found SDK file: $SDK_NAME"
              echo "Downloading from: $URL"
              
              rm -f sdk.tar.xz
              if curl -L --retry 5 --retry-delay 5 --connect-timeout 30 -o sdk.tar.xz "$URL"; then
                FILE_SIZE=$(stat -c%s sdk.tar.xz 2>/dev/null || stat -f%z sdk.tar.xz 2>/dev/null || echo 0)
                if [ "$FILE_SIZE" -gt 50000000 ]; then
                  echo "Download successful! File size: $FILE_SIZE bytes"
                  SUCCESS=1
                  break
                else
                  echo "Downloaded file is too small ($FILE_SIZE bytes), trying next..."
                fi
              fi
            fi
            echo "Failed for version $ver, trying next..."
          done
          
          [ $SUCCESS -eq 1 ] || { echo "All dynamic download sources failed!"; exit 1; }
          
          tar -xf sdk.tar.xz
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_OUTPUT

      - name: Build IPK
        run: |
          cd "${{ steps.sdk.outputs.SDK_DIR }}"
          cp -r "${{ github.workspace }}" package/luci-app-daede
          make package/luci-app-daede/compile V=s

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: immortalwrt-sdk-*/bin/packages/**/luci-app-daede*.ipk
