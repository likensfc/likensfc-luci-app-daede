name: Build luci-app-daede IPK (Docker SDK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compile IPK using Official ImmortalWrt SDK Docker
        run: |
          mkdir -p output
          
          docker run --rm -v ${{ github.workspace }}:/workdir immortalwrt/sdk:x86-64 bash -c "
            set -ex
            
            # 1. 更新并安装 SDK 官方 feeds（自动解决 luci-base, curl, jq, rpcd 等基础依赖）
            ./scripts/feeds update -a
            ./scripts/feeds install -a
            
            # 2. 克隆 daed 后端依赖到 package 目录（解决依赖缺失警告）
            git clone https://github.com/daeuniverse/daed.git package/daed || true
            
            # 3. 将当前仓库的 luci-app-daede 源码放到 package 目录
            mkdir -p package/luci-app-daede
            cp -r /workdir/* package/luci-app-daede/
            
            # 4. 生成默认配置文件，彻底杜绝触发 interactive menuconfig 导致终端报错
            make defconfig
            
            # 5. 开始编译 luci-app-daede 插件
            make package/luci-app-daede/compile V=s
            
            # 6. 查找编译好的 ipk 并复制到挂载目录
            find bin/packages/ -name 'luci-app-daede*.ipk' -exec cp {} /workdir/output/ \;
            find bin/packages/ -name 'daed*.ipk' -exec cp {} /workdir/output/ \;
          "

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: output/*.ipk
