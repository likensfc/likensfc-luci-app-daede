name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build IPK with Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/src immortalwrt/sdk:24.10-x86-64 \
            bash -c "
              cd /src && cp -r . package/luci-app-daede && make package/luci-app-daede/compile V=s
            "
          
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: bin/packages/**/luci-app-daede*.ipk
