name: Build luci-app-daede IPK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wget tar xz-utils build-essential gcc g++ gawk flex bison libncurses5-dev libssl-dev zlib1g-dev unzip python3

      - name: Download SDK (try multiple versions)
        id: sdk
        run: |
          # 尝试多个版本号格式
          VERSIONS=("24.10" "24.10.0" "24.10.1" "24.10.2")
          MIRRORS=(
            "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases"
            "https://mirrors.pku.edu.cn/openwrt/releases"
            "https://downloads.openwrt.org/releases"
          )

          for ver in "${VERSIONS[@]}"; do
            for mirror in "${MIRRORS[@]}"; do
              URL="${mirror}/${ver}/targets/x86/64/openwrt-sdk-${ver}-x86_64_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
              echo "Trying: $URL"
              if wget -q --timeout=60 --tries=2 "$URL" -O sdk.tar.xz && [ -s sdk.tar.xz ]; then
                echo "Success: $URL"
                tar -xf sdk.tar.xz
                SDK_DIR=$(find . -maxdepth 1 -name "openwrt-sdk-*" -type d | head -1)
                echo "SDK_DIR=$SDK_DIR" >> $GITHUB_OUTPUT
                exit 0
              fi
            done
          done

          echo "All versions/mirrors failed"
          exit 1

      - name: Build IPK
        run: |
          cd "${{ steps.sdk.outputs.SDK_DIR }}"
          cp -r "${{ github.workspace }}" package/luci-app-daede
          make package/luci-app-daede/compile V=s

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-daede-ipk
          path: openwrt-sdk-*/bin/packages/**/luci-app-daede*.ipk
